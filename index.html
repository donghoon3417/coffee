<body>

<div class="header-title">
☕ COFFEE ORDER
</div>

<div class="top-menu">

  <button
    id="formBtn"
    class="top-btn active"
    onclick="showForm()"
  >
    주문하기
  </button>

  <button
    id="listBtn"
    class="top-btn"
    onclick="showList()"
  >
    주문목록
  </button>

  <button
    id="adminBtn"
    onclick="adminLogin()"
  >
    관리자
  </button>

  <button
    id="logoutBtn"
    onclick="adminLogout()"
    style="display:none;"
  >
    로그아웃
  </button>

</div>

<div id="formPage">

  <div class="form-container">

    <!-- =========================
         이름 선택
    ========================== -->

    <h4>👤 이름 선택</h4>

    <div id="nameButtons"></div>

    <div style="
      display:flex;
      gap:6px;
      align-items:center;
      margin-bottom:8px;
    ">

      <input
        id="newName"
        placeholder="이름 등록"
        style="
          flex:1;
          margin:0;
          max-width:none;
        "
      >

      <button onclick="addName()">
        이름등록
      </button>

      <button onclick="deleteAllNames()">
        이름삭제
      </button>

    </div>

    <!-- =========================
         팀 관리
    ========================== -->

    <div style="
      display:flex;
      justify-content:center;
      gap:6px;
      margin-bottom:8px;
      flex-wrap:wrap;
    ">

      <button
        id="teamToggleBtn"
        onclick="toggleTeam()"
        style="display:none;"
      >
        팀 관리 열기/닫기
      </button>

      <button
        id="saveTeamBtn"
        onclick="saveTeam()"
        style="display:none;"
      >
        팀 저장
      </button>

      <button
  id="editTeamBtn"
  onclick="editTeam()"
  style="display:none;"
>
  팀 수정
</button>

    </div>

    <div id="teamSection">

      <h4>👥 팀 선택</h4>

      <div id="teamButtons"></div>

    </div>

    <!-- =========================
         메뉴
    ========================== -->

    <h4>🍵 메뉴</h4>

    <div id="extraSection">

      <button
        class="caffeine-btn"
        onclick="toggleDecaf(this)"
      >
        디카페인
      </button>

      <button
        class="caffeine-btn active"
        onclick="toggleCaffeine(this)"
      >
        카페인
      </button>

      <button
        class="caffeine-btn"
        onclick="toggleNormalDrink(this)"
      >
        일반음료
      </button>

    </div>

    <!-- 안내문 -->

    <div class="info-text">

      &lt;본인의 이름 버튼을 선택한 후 메뉴를 선택해주세요.&gt;<br>

      &lt;메뉴 선택 후 주문하기 버튼을 눌러주세요.&gt;<br>

      &lt;버튼이 없는 메뉴는 직접 입력 후 주문해주세요.&gt;

    </div>

    <!-- 메뉴 버튼 -->

    <div id="menuSection"></div>

    <!-- =========================
         온도 / 사이즈
    ========================== -->

    <div style="
      display:flex;
      justify-content:center;
      gap:30px;
      flex-wrap:wrap;
    ">

      <div>

        <h4>🔥 HOT / ❄ ICE</h4>

        <div id="tempSection">

          <button onclick="selectTemp(this,'HOT')">
            HOT
          </button>

          <button onclick="selectTemp(this,'ICE')">
            ICE
          </button>

        </div>

      </div>

      <div>

        <h4>📏 사이즈</h4>

        <div id="sizeSection">

          <button onclick="selectSize(this,'S')">
            S
          </button>

          <button onclick="selectSize(this,'M')">
            M
          </button>

          <button onclick="selectSize(this,'L')">
            L
          </button>

        </div>

      </div>

    </div>

    <!-- =========================
         기타 입력
    ========================== -->

    <h4>✍️ 기타 메뉴</h4>

    <input
      id="customMenu"
      placeholder="직접 입력 (기타 메뉴)"
    >

    <input
      id="option"
      placeholder="옵션"
    >

    <input
      id="note"
      placeholder="요청사항"
    >

    <button
      id="saveBtn"
      onclick="save()"
      disabled
    >
      주문하기
    </button>

  </div>

</div>

<!-- =========================

========================== -->
