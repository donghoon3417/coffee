<script>
  window.teams = {};
  window.currentTeam = DEFAULT_TEAM;
  window.selectedTeams = [DEFAULT_TEAM];
  window.hiddenNamesVersion = 0;

  // =========================
  // 서버에서 팀 불러오기
  // =========================
  function loadTeams() {
    google.script.run
      .withSuccessHandler((res) => {
        window.teams = res || {};

        // URL 파라미터로 지정된 팀을 현재 팀으로 고정
        window.currentTeam = DEFAULT_TEAM;
        window.selectedTeams = [DEFAULT_TEAM];

        renderTeamButtons();

        // 팀이 확정된 후 해당 팀의 명단 불러오기
        loadNames();
      })
      .getTeamsFromServer();
  }

  // =========================
  // 서버에서 이름 불러오기
  // =========================
  function loadNames() {
    const requestVersion = window.hiddenNamesVersion;
    const team = window.currentTeam || DEFAULT_TEAM;

    google.script.run
      .withSuccessHandler((personalNames) => {
        google.script.run
          .withSuccessHandler((hidden) => {
            // 팀 변경 이후 시작된 이전 요청이면 무시
            if (requestVersion !== window.hiddenNamesVersion) {
              return;
            }

            window.hiddenNames = hidden || [];

            window.nameList = [...new Set(personalNames || [])];

            // 현재 팀의 명단을 로컬에도 보관
            const storageKey = "nameList_" + team;

            localStorage.setItem(storageKey, JSON.stringify(window.nameList));

            console.log("현재 팀:", team);
            console.log("서버 명단:", window.nameList);
            console.log("hiddenNames:", window.hiddenNames);

            renderNameButtons();
            highlightSelected();
            updateNameInput();
            checkForm();
          })
          .getHiddenNames(team);
      })
      .getNamesFromServer(team);
  }

  // =========================
  // 팀 저장
  // =========================
  function saveTeam() {
    if (!window.appState.isAdmin) {
      alert("관리자만 가능");
      return;
    }

    const name = prompt("팀 이름");

    if (!name) return;

    if (window.selectedNames.length === 0) {
      alert("이름 선택 먼저");
      return;
    }

    // 팀 객체에 추가
    window.teams[name] = [...window.selectedNames];

    // 팀별 이름 목록 저장
    google.script.run.saveNamesToServer(name, window.selectedNames);

    google.script.run
      .withSuccessHandler((res) => {
        window.teams = res || {};

        renderTeamButtons();

        alert("팀 저장 완료");
      })
      .saveTeamsToServer(window.teams);
  }

  // =========================
  // 팀 버튼 렌더링
  // =========================
  function renderTeamButtons() {
    console.log("teams =", window.teams);

    const box = document.getElementById("teamButtons");

    if (!box) return;

    box.innerHTML = "";

    // 현재 팀 표시
    const currentTeamLabel = document.createElement("div");

    currentTeamLabel.className = "current-team-label";
    currentTeamLabel.innerText = `현재 팀: ${window.currentTeam || DEFAULT_TEAM}`;

    currentTeamLabel.style.fontWeight = "bold";
    currentTeamLabel.style.marginBottom = "8px";

    box.appendChild(currentTeamLabel);

    Object.keys(window.teams).forEach((t) => {
      const wrap = document.createElement("div");

      wrap.style.display = "inline-flex";
      wrap.style.margin = "4px";

      const btn = document.createElement("button");

      btn.type = "button";
      btn.innerText = t;

      btn.onclick = () => {
        // 현재 팀 변경
        window.currentTeam = t;
        window.selectedTeams = [t];

        console.log("팀 버튼 클릭:", t);
        console.log("현재 팀:", window.currentTeam);

        // 현재 팀 표시 갱신
        const currentTeamLabel = box.querySelector(".current-team-label");

        if (currentTeamLabel) {
          currentTeamLabel.innerText = `현재 팀: ${window.currentTeam}`;
        }

        // 팀 변경이므로 이전 서버 요청 무효화
        window.hiddenNamesVersion++;

        let members = window.teams[t];

        if (Array.isArray(members)) {
          members = [...members];
        } else if (typeof members === "string") {
          members = members
            .split(",")
            .map((x) => x.trim())
            .filter((x) => x);
        } else {
          members = [];
        }

        console.log("팀원:", members);
        console.log("클릭 전 hiddenNames:", [...(window.hiddenNames || [])]);

        // 현재 팀에 포함된 이름은 숨김 목록에서 제외
        window.hiddenNames = (window.hiddenNames || []).filter(
          (name) => !members.includes(name),
        );

        console.log("클릭 후 hiddenNames:", [...window.hiddenNames]);

        // 현재 팀의 개인 명단 가져오기
        google.script.run
          .withSuccessHandler((savedNames) => {
            const personalNames = savedNames || [];

            // 팀원 + 개인적으로 추가된 이름
            window.nameList = [...new Set([...members, ...personalNames])];

            const newHiddenNames = [...window.hiddenNames];

            // 현재 팀의 hiddenNames 저장
            google.script.run
              .withSuccessHandler(() => {
                window.selectedNames = [];

                // 현재 팀 명단을 로컬에도 저장
                const storageKey = "nameList_" + t;

                localStorage.setItem(
                  storageKey,
                  JSON.stringify(window.nameList),
                );

                renderNameButtons();
                highlightSelected();
                updateNameInput();
                checkForm();
              })
              .saveHiddenNames(t, newHiddenNames);
          })
          .getNamesFromServer(t);
      };

      // =========================
      // 팀 삭제 버튼
      // =========================
      const del = document.createElement("button");

      del.innerText = "✖";

      del.style.background = "#ff4d4f";
      del.style.color = "white";
      del.style.marginLeft = "3px";

      if (!window.appState.isAdmin) {
        del.style.display = "none";
      }

      del.onclick = () => {
        if (!confirm(t + " 삭제?")) return;

        delete window.teams[t];

        google.script.run
          .withSuccessHandler((res) => {
            window.teams = res || {};

            renderTeamButtons();
          })
          .saveTeamsToServer(window.teams);
      };

      wrap.appendChild(btn);
      wrap.appendChild(del);

      box.appendChild(wrap);
    });
  }

  // =========================
  // 팀 수정
  // =========================
  function editTeam() {
    if (!window.appState.isAdmin) {
      alert("관리자만 가능");
      return;
    }

    const oldTeamNames = Object.keys(window.teams);

    if (oldTeamNames.length === 0) {
      alert("팀 없음");
      return;
    }

    // =========================
    // 기존 팀 선택
    // =========================
    let oldTeam = prompt("수정할 기존 팀 이름\n\n" + oldTeamNames.join(", "));

    if (!oldTeam) return;

    oldTeam = oldTeam.trim();

    // 공백 무시 검색
    const matchedTeam = oldTeamNames.find((t) => t.trim() === oldTeam);

    if (!matchedTeam) {
      alert("없는 팀");
      return;
    }

    // =========================
    // 새 팀 이름
    // =========================
    let newTeam = prompt("팀이름을 설정하십시오.", matchedTeam);

    if (!newTeam) return;

    newTeam = newTeam.trim();

    // =========================
    // 현재 보이는 이름 기준 저장
    // =========================
    const members = window.nameList.filter(
      (name) => !window.hiddenNames.includes(name),
    );

    // 기존 팀 삭제
    delete window.teams[matchedTeam];

    // 새 팀 저장
    window.teams[newTeam] = [...new Set(members)];

    // 새 팀의 이름 목록 저장
    google.script.run.saveNamesToServer(newTeam, [...new Set(members)]);

    google.script.run
      .withSuccessHandler((res) => {
        window.teams = res || {};

        renderTeamButtons();

        alert("팀 수정 완료");
      })
      .saveTeamsToServer(window.teams);
  }

  // =========================
  // 팀 토글
  // =========================
  function toggleTeam() {
    if (!window.appState.isAdmin) {
      return;
    }

    const el = document.getElementById("teamSection");

    if (!el) return;

    const isHidden = el.style.display === "none";

    el.style.display = isHidden ? "block" : "none";

    localStorage.setItem("teamVisible", isHidden ? "true" : "false");
  }

  // =========================
  // 초기 실행
  // =========================
  document.addEventListener("DOMContentLoaded", () => {
    // 팀을 먼저 확정하고
    // loadTeams() 내부에서
    // 해당 팀의 명단을 불러온다.
    loadTeams();
  });
</script>
