<script>
  window.teams = {};
  window.currentTeam = null;
  window.selectedTeams = [];

  // =========================
  // 서버에서 팀 불러오기
  // =========================
  function loadTeams() {
    google.script.run

      .withSuccessHandler((res) => {
        const before = JSON.stringify(window.teams);

        const after = JSON.stringify(res || {});

        if (before !== after) {
          window.teams = res || {};

          renderTeamButtons();

          // 링크의 team=peace 자동 적용
          if (DEFAULT_TEAM && window.teams[DEFAULT_TEAM]) {
            const members = window.teams[DEFAULT_TEAM];

            window.nameList = [...new Set(members)];

            renderNameButtons();

            highlightSelected?.();
            updateNameInput?.();
            checkForm?.();
          }

          google.script.run

            .withSuccessHandler((team) => {
              google.script.run

                .withSuccessHandler((savedTeams) => {
                  let teams = [];

                  try {
                    teams = JSON.parse(savedTeams || "[]");
                  } catch (e) {
                    teams = [];
                  }

                  const btns = document.querySelectorAll("#teamButtons button");

                  teams.forEach((team) => {
                    btns.forEach((btn) => {
                      if (btn.innerText === team) {
                        btn.onclick(true);
                      }
                    });
                  });
                })

                .getLinkTeam(DEFAULT_TEAM);
            })

            .getCurrentTeam();
        }
      })

      .getTeamsFromServer();
  }

  // =========================
  // 서버에서 이름 불러오기
  // =========================
  function loadNames() {
    google.script.run
      .withSuccessHandler((res) => {
        window.nameList = res || [];

        google.script.run
          .withSuccessHandler((hidden) => {
            window.hiddenNames = hidden || [];

            renderNameButtons();
            highlightSelected();
            updateNameInput();
            checkForm();
          })
          .getHiddenNames(DEFAULT_TEAM);
      })
      .getNamesFromServer(DEFAULT_TEAM);
  }
  // =========================
  // 팀 저장
  // =========================
  function saveTeam() {
    if (!window.appState.isAdmin) {
      alert("관리자만 가능");
      return;
    }

    const name = prompt("팀 이름");

    if (!name) return;

    if (window.selectedNames.length === 0) {
      alert("이름 선택 먼저");
      return;
    }

    // 팀 객체에 추가
    window.teams[name] = [...window.selectedNames];

    google.script.run.saveNamesToServer(name, window.selectedNames);

    google.script.run

      .withSuccessHandler((res) => {
        window.teams = res || {};

        renderTeamButtons();

        alert("팀 저장 완료");
      })

      .saveTeamsToServer(window.teams);
  }

  // =========================
  // 팀 버튼 렌더링
  // =========================
  function renderTeamButtons() {
    console.log("teams =", window.teams);

    const box = document.getElementById("teamButtons");

    if (!box) return;

    box.innerHTML = "";

    Object.keys(window.teams).forEach((t) => {
      const wrap = document.createElement("div");

      wrap.style.display = "inline-flex";

      wrap.style.margin = "4px";

      const btn = document.createElement("button");

      btn.innerText = t;

      btn.onclick = (isRestore = false) => {
        window.currentTeam = t;

        if (!window.selectedTeams.includes(t)) {
          window.selectedTeams.push(t);
        }

        google.script.run.setLinkTeam(
          DEFAULT_TEAM,
          JSON.stringify(window.selectedTeams),
        );

        let members = window.teams[t];

        if (Array.isArray(members)) {
          members = members;
        } else if (typeof members === "string") {
          members = members
            .split(",")
            .map((x) => x.trim())
            .filter((x) => x);
        } else {
          members = [];
        }
        // 팀 버튼을 직접 클릭했을 때만
        // 해당 팀원들의 숨김 해제
        if (!isRestore) {
          window.hiddenNames = (window.hiddenNames || []).filter(
            (name) => !members.includes(name),
          );

          google.script.run.saveHiddenNames(DEFAULT_TEAM, window.hiddenNames);
        }

        // 기존 이름 유지 + 팀원 누적 추가
        window.nameList = [...new Set([...window.nameList, ...members])];

        // 팀원 선택 초기화
        window.selectedNames = [];
        renderNameButtons();
        highlightSelected();
        updateNameInput();
        checkForm();
      };

      const del = document.createElement("button");

      del.innerText = "✖";

      del.style.background = "#ff4d4f";

      del.style.color = "white";

      del.style.marginLeft = "3px";

      if (!window.appState.isAdmin) {
        del.style.display = "none";
      }

      del.onclick = () => {
        if (!confirm(t + " 삭제?")) return;

        delete window.teams[t];

        google.script.run

          .withSuccessHandler((res) => {
            window.teams = res || {};

            renderTeamButtons();
          })

          .saveTeamsToServer(window.teams);
      };

      wrap.appendChild(btn);
      wrap.appendChild(del);

      box.appendChild(wrap);
    });
  }

  // =========================
  // 팀 수정
  // =========================
  function editTeam() {
    if (!window.appState.isAdmin) {
      alert("관리자만 가능");
      return;
    }

    const oldTeamNames = Object.keys(window.teams);

    if (oldTeamNames.length === 0) {
      alert("팀 없음");
      return;
    }

    // =========================
    // 기존 팀 선택
    // =========================
    let oldTeam = prompt("수정할 기존 팀 이름\n\n" + oldTeamNames.join(", "));

    if (!oldTeam) return;

    oldTeam = oldTeam.trim();

    // 공백 무시 검색
    const matchedTeam = oldTeamNames.find((t) => t.trim() === oldTeam);

    if (!matchedTeam) {
      alert("없는 팀");
      return;
    }

    // =========================
    // 새 팀 이름
    // =========================
    let newTeam = prompt("팀이름을 설정하십시오.", matchedTeam);

    if (!newTeam) return;

    newTeam = newTeam.trim();

    // =========================
    // 현재 보이는 이름 기준 저장
    // =========================
    const members = window.nameList.filter(
      (name) => !window.hiddenNames.includes(name),
    );

    // 기존 팀 삭제
    delete window.teams[matchedTeam];

    // 새 팀 저장
    window.teams[newTeam] = [...new Set(members)];

    google.script.run.saveNamesToServer(newTeam, [...new Set(members)]);

    google.script.run

      .withSuccessHandler((res) => {
        window.teams = res || {};

        renderTeamButtons();

        alert("팀 수정 완료");
      })

      .saveTeamsToServer(window.teams);
  }

  // =========================
  // 팀 토글
  // =========================
  function toggleTeam() {
    if (!window.appState.isAdmin) {
      return;
    }
    const el = document.getElementById("teamSection");

    if (!el) return;

    const isHidden = el.style.display === "none";

    el.style.display = isHidden ? "block" : "none";

    localStorage.setItem("teamVisible", isHidden ? "true" : "false");
  }

  // =========================
  // 초기 실행
  // =========================
  document.addEventListener("DOMContentLoaded", () => {
    renderTeamButtons();

    loadTeams();

    loadNames();

    setInterval(() => {
      loadTeams();

      loadNames();
    }, 3000);
  });
</script>
