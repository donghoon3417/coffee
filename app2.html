<script>
function renderList(data, summary){
  drawTable(data.slice(1));
  drawSummary(summary);

  updateSaveButton();
}

// =========================
function drawTable(data){

  let html = `
  <div class="table-wrap">

<table>
<tr>
  <th>선택</th>
  <th>팀</th>
  <th>시간</th>
  <th>이름</th>
  <th>메뉴</th>
  <th>HOT/ICE</th>
  <th>사이즈</th>
  <th>옵션</th>
  <th>요청</th>
</tr>`;
  data.slice().reverse().forEach(row=>{

    const idx = row[row.length-1];

    html += "<tr>";

    html += `
    <td>
      <input
        type="checkbox"
        class="rowCheck"
        value="${idx}">
    </td>`;

for(let i=0;i<row.length-1;i++){
  html += `<td>${row[i] || ""}</td>`;
}

    html += "</tr>";
  });

  html += `
  </table>

  </div>`;

  document.getElementById("list").innerHTML = html;
}

// =========================
function drawSummary(res){

let html = `
<div class="summary-box">

<h3>📊 주문 집계</h3>
`;

let totalCount = 0;

Object.entries(res)

.sort((a,b)=>b[1].count-a[1].count)

.forEach(([k,v])=>{

  totalCount += v.count;

  html += `

  <div class="summary-item">

    <b>
      ${k} ${v.count}잔
    </b>

    <span class="summary-names">
      (${v.names.join(", ")})
    </span>

  </div>
  `;
});

html += `

<div class="summary-total">
  현재 총 주문 수 : ${totalCount}잔
</div>

<div class="summary-actions">

<button class="copy-btn" onclick="copyOrder()">
  카톡 복사
</button>

  <button onclick="deleteChecked()">
    선택 삭제
  </button>

  <button onclick="resetOrders()">
    전체 삭제
  </button>

  <button
    id="closeBtn"
    onclick="toggleOrderClose()">

    주문 마감

  </button>

</div>

</div>
`;

document
.getElementById("list")
.insertAdjacentHTML("afterbegin", html);
}

function updateSaveButton(){

  // 주문하기 버튼
  const btn =
    document.getElementById("saveBtn");

  if(btn){

    if(isOrderClosed){

      btn.disabled = true;
      btn.innerText = "주문이 마감됨";
      btn.style.background = "#999";

    }else{

      btn.disabled = false;
      btn.innerText = "주문하기";
      btn.style.background = "#4CAF50";
    }
  }

  // 주문 마감 버튼
  const closeBtn =
    document.getElementById("closeBtn");

  if(closeBtn){

    if(isOrderClosed){

      closeBtn.disabled = true;
      closeBtn.innerText = "주문 마감됨";
      closeBtn.style.background = "#999";
      closeBtn.style.cursor = "not-allowed";

    }else{

      closeBtn.disabled = false;
      closeBtn.innerText = "주문 마감";
      closeBtn.style.background = "";
      closeBtn.style.cursor = "pointer";
    }
  }
}
// =========================
function deleteChecked(){

  const checks = document.querySelectorAll(".rowCheck:checked");
  if(!checks.length) return alert("선택 없음");

  if(!confirm("삭제할까?")) return;

  const arr = [];
  checks.forEach(c=>arr.push(Number(c.value)));

  google.script.run.withSuccessHandler(()=>{
    fullData = [];
    loadList();
  }).deleteMultiple(arr);
}

// =========================
function resetOrders(){
  if(!confirm("전체 삭제?")) return;

  google.script.run.withSuccessHandler(()=>{
    fullData = [];
    loadList();
  }).resetAllOrders();
}

// =========================
function copyOrder(){

  google.script.run

    .withSuccessHandler((t)=>{

      // 최신 브라우저
      if(
        navigator.clipboard &&
        window.isSecureContext
      ){

        navigator.clipboard
          .writeText(t)

          .then(()=>{

            alert("복사 완료");
          })

          .catch(()=>{

            fallbackCopy(t);
          });

      }else{

        // fallback
        fallbackCopy(t);
      }
    })

  .getOrderText(DEFAULT_TEAM);
}

// =========================
// fallback 복사
// =========================
function fallbackCopy(text){

  const textarea =
    document.createElement("textarea");

  textarea.value = text;

  textarea.style.position = "fixed";

  textarea.style.left = "-9999px";

  document.body.appendChild(textarea);

  textarea.select();

  try{

    document.execCommand("copy");

    alert("복사 완료");

  }catch(e){

    alert("복사 실패");
  }

  document.body.removeChild(textarea);
}
// =========================
// 페이지 다시 보이면 새로고침
// =========================
document.addEventListener(
  "visibilitychange",
  ()=>{

    if(!document.hidden){

      loadList();
    }
  }
);

</script>
