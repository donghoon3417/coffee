<script>
// =========================
// 관리자 로그인
// =========================
function adminLogin(){

  const pw =
    prompt("관리자 비밀번호");

  if(!pw) return;

  google.script.run

    .withSuccessHandler((result)=>{

   if(result){

  window.appState.isAdmin = true;
  window.isAdmin = true;

  sessionStorage.setItem(
    "isAdmin",
    "true"
  );

  applyAdminUI();

        alert("관리자 로그인 완료");

      }else{

        alert("비밀번호 틀림");
      }
    })

    .checkAdmin(pw);
}

// =========================
// 관리자 로그아웃
// =========================
function adminLogout(){

window.appState.isAdmin = false;
window.isAdmin = false;

  sessionStorage.removeItem("isAdmin");

  removeAdminUI();

  alert("관리자 로그아웃");
}

// =========================
// 관리자 UI 적용
// =========================
function applyAdminUI(){

  const ids = [
    "logoutBtn",
    "saveTeamBtn",
    "editTeamBtn",
      "teamToggleBtn"

  ];

const teamButtons =
  document.getElementById("teamButtons");

if(teamButtons){
  teamButtons.style.display = "block";
}

  const btn =
    document.getElementById("adminBtn");

  if(btn){
    btn.innerText = "관리자모드";
  }

  ids.forEach(id => {

    const el =
      document.getElementById(id);

    if(el){
      el.style.display =
        "inline-block";
    }
  });
}

// =========================
// 관리자 UI 제거
// =========================
function removeAdminUI(){

const ids = [
  "logoutBtn",
  "saveTeamBtn",
  "editTeamBtn",
  "teamToggleBtn"
];
const teamButtons =
  document.getElementById("teamButtons");

if(teamButtons){
  teamButtons.style.display = "none";
}
  const btn =
    document.getElementById("adminBtn");

  if(btn){
    btn.innerText = "관리자";
  }

  ids.forEach(id => {

    const el =
      document.getElementById(id);

    if(el){
      el.style.display = "none";
    }
  });
}

// =========================
// 관리자 상태 복원
// =========================
document.addEventListener(
  "DOMContentLoaded",
  ()=>{

    if(window.appState.isAdmin){

      applyAdminUI();

    }else{

      removeAdminUI();
    }
  }
);

</script>
