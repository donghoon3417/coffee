<script>
window.nameList = window.nameList || [];
window.selectedNames = window.selectedNames || [];

window.hiddenNames =
  JSON.parse(
    sessionStorage.getItem("hiddenNames") || "[]"
  );

// =========================
// 관리자 상태
// =========================
window.isAdmin =
  sessionStorage.getItem("isAdmin") === "true";

// =========================
// 이름 버튼 렌더링
// =========================
function renderNameButtons(){

  const box =
    document.getElementById("nameButtons");

  if(!box) return;

  box.innerHTML = "";

  window.nameList.forEach(name => {

    const hidden =
      window.hiddenNames.includes(name) &&
      !window.selectedNames.includes(name);

    if(hidden) return;

    const wrap =
      document.createElement("div");

    wrap.style.display = "inline-flex";
    wrap.style.margin = "4px";

    const btn =
      document.createElement("button");

    btn.innerText = name;

    if(window.selectedNames.includes(name)){
      btn.classList.add("active");
    }

    btn.onclick = () => {

      if(window.selectedNames.includes(name)){

        window.selectedNames =
          window.selectedNames.filter(
            n => n !== name
          );

      }else{

        window.selectedNames.push(name);
      }

      highlightSelected();

      updateNameInput();

      checkForm();
    };

    const del =
      document.createElement("button");

    del.innerText = "✖";

    del.style.background = "#ff4d4f";
    del.style.color = "white";
    del.style.marginLeft = "3px";

    del.onclick = () => {

      // 중복 방지
      if(
        !window.hiddenNames.includes(name)
      ){

        window.hiddenNames.push(name);
      }

      // 선택 해제
      window.selectedNames =
        window.selectedNames.filter(
          n => n !== name
        );

      // 저장
      sessionStorage.setItem(
        "hiddenNames",
        JSON.stringify(window.hiddenNames)
      );

      // UI 즉시 갱신
      renderNameButtons();

      highlightSelected();

      updateNameInput();

      checkForm();
    };

    wrap.appendChild(btn);

    wrap.appendChild(del);

    box.appendChild(wrap);
  });
}

// =========================
// 선택 강조
// =========================
function highlightSelected(){

  document
    .querySelectorAll("#nameButtons button")
    .forEach(btn => {

      if(btn.innerText === "✖") return;

      btn.classList.toggle(
        "active",
        window.selectedNames.includes(
          btn.innerText
        )
      );
    });
}

// =========================
// input 갱신
// =========================
function updateNameInput(){

  const input =
    document.getElementById("selectedNames");

  if(!input) return;

  input.value =
    window.selectedNames.join(", ");
}

// =========================
// 이름 추가
// =========================
function addName(){

  const input =
    document.getElementById("newName");

  if(!input) return;

  const name =
    input.value.trim();

  if(!name) return;

  // 이미 존재하면 숨김 해제
  if(window.nameList.includes(name)){

    window.hiddenNames =
      window.hiddenNames.filter(
        n => n !== name
      );

    sessionStorage.setItem(
      "hiddenNames",
      JSON.stringify(window.hiddenNames)
    );

    renderNameButtons();

    input.value = "";

    return;
  }

  // 신규 추가
  const newList = [
    ...window.nameList,
    name
  ];

  google.script.run

    .withSuccessHandler((res)=>{

      window.nameList = res || [];

      input.value = "";

      renderNameButtons();
    })

    .saveNamesToServer(newList);
}

// =========================
// 관리자 로그인
// =========================
function adminLogin(){

  const pw =
    prompt("관리자 비밀번호");

  if(!pw) return;

  google.script.run

    .withSuccessHandler((result)=>{

      if(result){

        window.isAdmin = true;

        sessionStorage.setItem(
          "isAdmin",
          "true"
        );

        applyAdminUI();

        alert("관리자 로그인 완료");

      }else{

        alert("비밀번호 틀림");
      }
    })

    .checkAdmin(pw);
}

// =========================
// 관리자 로그아웃
// =========================
function adminLogout(){

  window.isAdmin = false;

  sessionStorage.removeItem("isAdmin");

  removeAdminUI();

  alert("관리자 로그아웃");
}

// =========================
// 관리자 UI 적용
// =========================
function applyAdminUI(){

  const btn =
    document.getElementById("adminBtn");

  const logout =
    document.getElementById("logoutBtn");

  const teamBtn =
    document.getElementById("teamToggleBtn");

  const saveTeamBtn =
    document.getElementById("saveTeamBtn");

  const editTeamBtn =
    document.getElementById("editTeamBtn");

  if(btn){
    btn.innerText = "관리자모드";
  }

  if(logout){
    logout.style.display = "inline-block";
  }

  if(teamBtn){
    teamBtn.style.display = "inline-block";
  }

  if(saveTeamBtn){
    saveTeamBtn.style.display = "inline-block";
  }

  if(editTeamBtn){
    editTeamBtn.style.display = "inline-block";
  }
}

// =========================
// 관리자 UI 제거
// =========================
function removeAdminUI(){

  const btn =
    document.getElementById("adminBtn");

  const logout =
    document.getElementById("logoutBtn");

  const teamBtn =
    document.getElementById("teamToggleBtn");

  const saveTeamBtn =
    document.getElementById("saveTeamBtn");

  const editTeamBtn =
    document.getElementById("editTeamBtn");

  if(btn){
    btn.innerText = "관리자";
  }

  if(logout){
    logout.style.display = "none";
  }

  if(teamBtn){
    teamBtn.style.display = "none";
  }

  if(saveTeamBtn){
    saveTeamBtn.style.display = "none";
  }

  if(editTeamBtn){
    editTeamBtn.style.display = "none";
  }
}

// =========================
// 관리자 상태 복원
// =========================
document.addEventListener(
  "DOMContentLoaded",
  ()=>{

    if(window.isAdmin){

      applyAdminUI();

    }else{

      removeAdminUI();
    }
  }
);

// =========================
// 탭 종료시 자동 로그아웃
// =========================
window.addEventListener(
  "beforeunload",
  ()=>{
    sessionStorage.removeItem("isAdmin");
  }
);
</script>
