<script>
window.selectedNames = [];
window.nameList = JSON.parse(
  localStorage.getItem("nameList") || "[]"
);
window.hiddenNames =
  JSON.parse(
    sessionStorage.getItem("hiddenNames") || "[]"
  );

// =========================
// 이름 버튼 렌더링
// =========================
function renderNameButtons(){

  const box =
    document.getElementById("nameButtons");

  if(!box) return;

  box.innerHTML = "";

const list =
  (Array.isArray(window.nameList)
    ? window.nameList
    : [])
  .filter(
    name => !window.hiddenNames.includes(name)
  );

  list.forEach(name => {

    const wrap =
      document.createElement("div");

    wrap.style.display = "inline-flex";
    wrap.style.margin = "4px";

    // =========================
    // 이름 버튼
    // =========================
    const btn =
      document.createElement("button");

    btn.innerText = name;

    if(window.selectedNames.includes(name)){
      btn.classList.add("active");
    }

    btn.onclick = ()=>{

      if(window.selectedNames.includes(name)){

        window.selectedNames =
          window.selectedNames.filter(
            n => n !== name
          );

      }else{

        window.selectedNames.push(name);
      }

      updateNameInput();

      highlightSelected();

      checkForm();
    };

    // =========================
    // 삭제 버튼
    // =========================
    const del =
      document.createElement("button");

    del.innerText = "✖";

    del.style.background = "#ff4d4f";
    del.style.color = "white";
    del.style.marginLeft = "3px";
del.onclick = ()=>{

  if(!confirm(name + " 이름을 숨길까요?")){
    return;
  }

  // 숨김목록 추가
  if(!window.hiddenNames.includes(name)){

    window.hiddenNames.push(name);
  }

  sessionStorage.setItem(
    "hiddenNames",
    JSON.stringify(window.hiddenNames)
  );

  // 선택 제거
  window.selectedNames =
    window.selectedNames.filter(
      n => n !== name
    );

  renderNameButtons();

  updateNameInput();

  highlightSelected();

  checkForm();
};

    wrap.appendChild(btn);
    wrap.appendChild(del);

    box.appendChild(wrap);
  });
}

// =========================
// 선택 UI 표시
// =========================
function highlightSelected(){

  const box =
    document.getElementById("nameButtons");

  if(!box) return;

  const buttons =
    box.querySelectorAll(
      "div > button:first-child"
    );

  buttons.forEach(btn => {

    const name =
      btn.innerText.trim();

    if(window.selectedNames.includes(name)){

      btn.classList.add("active");

    }else{

      btn.classList.remove("active");
    }
  });
}

// =========================
// 이름 추가
// =========================
function addName(){

  const input =
    document.getElementById("newName");

  const name =
    input.value.trim();

  if(!name) return;

  if(window.nameList.includes(name)){

    alert("이미 있음");

    return;
  }

  window.nameList.push(name);

  localStorage.setItem(
    "nameList",
    JSON.stringify(window.nameList)
  );

  google.script.run
    .withSuccessHandler(()=>{

      renderNameButtons();

    })
    .saveNamesToServer(window.nameList);

  input.value = "";
}

// =========================
// 전체 삭제
// =========================
function deleteAllNames(){

  if(!confirm("등록된 이름 전체 삭제할까요?")){
    return;
  }

  window.nameList = [];

  window.selectedNames = [];

  localStorage.setItem(
    "nameList",
    JSON.stringify(window.nameList)
  );

  google.script.run
    .withSuccessHandler(()=>{

      renderNameButtons();

      highlightSelected();

      updateNameInput();

      checkForm();

      alert("전체 삭제 완료");

    })
    .saveNamesToServer([]);
}

// =========================
// input 반영
// =========================
function updateNameInput(){

  const el =
    document.getElementById("name");

  if(el){

    el.value =
      window.selectedNames.join(", ");
  }
}

// =========================
// 초기 실행
// =========================
document.addEventListener(
  "DOMContentLoaded",
  ()=>{

    renderNameButtons();

    highlightSelected();
  }
);
</script>
