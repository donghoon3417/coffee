<script>
window.appState = window.appState || {
  nameList: [],
  selectedNames: [],
  hiddenNames: JSON.parse(
    sessionStorage.getItem("hiddenNames") || "[]"
  ),
  isAdmin:
    sessionStorage.getItem("isAdmin") === "true"
};

// =========================
// 상태 별칭
// =========================
Object.defineProperties(window, {
  nameList: {
    get: ()=>window.appState.nameList,
    set: v=>window.appState.nameList = v
  },
  selectedNames: {
    get: ()=>window.appState.selectedNames,
    set: v=>window.appState.selectedNames = v
  },
  hiddenNames: {
    get: ()=>window.appState.hiddenNames,
    set: v=>window.appState.hiddenNames = v
  }
});

// =========================
// 초기 데이터 로드
// =========================
window.nameList = [];
localStorage.removeItem("nameList");

// =========================
// 이름 버튼 렌더링
// =========================
function renderNameButtons(){

  const box =
    document.getElementById("nameButtons");

  if(!box) return;

  box.innerHTML = "";

  const visibleList =
    window.nameList.filter(
      name =>
        !window.hiddenNames.includes(name) ||
        window.selectedNames.includes(name)
    );

  visibleList.forEach(name => {

    const wrap =
      document.createElement("div");

    wrap.style.display = "inline-flex";
    wrap.style.margin = "4px";

    // =========================
    // 이름 버튼
    // =========================
    const btn =
      document.createElement("button");

    btn.innerText = name;

    btn.classList.toggle(
      "active",
      window.selectedNames.includes(name)
    );

    btn.onclick = ()=>{

      if(window.selectedNames.includes(name)){

        window.selectedNames =
          window.selectedNames.filter(
            n => n !== name
          );

      }else{

        window.selectedNames.push(name);
      }

      highlightSelected();

      updateNameInput();

      checkForm();
    };

    // =========================
    // 삭제 버튼
    // =========================
    const del =
      document.createElement("button");

    del.innerText = "✖";

    del.style.background = "#ff4d4f";
    del.style.color = "white";
    del.style.marginLeft = "3px";

    del.onclick = ()=>{

      if(
        !confirm(name + " 이름을 숨길까요?")
      ){
        return;
      }

      if(
        !window.hiddenNames.includes(name)
      ){
        window.hiddenNames.push(name);
      }

      window.selectedNames =
        window.selectedNames.filter(
          n => n !== name
        );

      sessionStorage.setItem(
        "hiddenNames",
        JSON.stringify(window.hiddenNames)
      );

      renderNameButtons();

      highlightSelected();

      updateNameInput();

      checkForm();
    };

    wrap.appendChild(btn);

    wrap.appendChild(del);

    box.appendChild(wrap);
  });
}

// =========================
// 선택 강조
// =========================
function highlightSelected(){

  document
    .querySelectorAll(
      "#nameButtons button"
    )
    .forEach(btn => {

      if(btn.innerText === "✖") return;

      btn.classList.toggle(
        "active",
        window.selectedNames.includes(
          btn.innerText.trim()
        )
      );
    });
}

// =========================
// input 반영
// =========================
function updateNameInput(){

  const el =
    document.getElementById("name");

  if(el){

    el.value =
      window.selectedNames.join(", ");
  }

  const el2 =
    document.getElementById(
      "selectedNames"
    );

  if(el2){

    el2.value =
      window.selectedNames.join(", ");
  }
}

// =========================
// 이름 추가
// =========================
function addName(){

  const input =
    document.getElementById("newName");

  if(!input) return;

  const name =
    input.value.trim();

  if(!name) return;

  // 이미 존재
  if(window.nameList.includes(name)){

    // 숨김 복구
    if(
      window.hiddenNames.includes(name)
    ){

      window.hiddenNames =
        window.hiddenNames.filter(
          n => n !== name
        );

      sessionStorage.setItem(
        "hiddenNames",
        JSON.stringify(window.hiddenNames)
      );

      renderNameButtons();

      alert("숨김 해제됨");

    }else{

      alert("이미 있음");
    }

    input.value = "";

    return;
  }

  // 신규 추가
  const newList = [
    ...window.nameList,
    name
  ];

  google.script.run

    .withSuccessHandler((res)=>{

      window.nameList = res || newList;

      localStorage.setItem(
        "nameList",
        JSON.stringify(window.nameList)
      );

      renderNameButtons();

      input.value = "";
    })

    .saveNamesToServer(newList);
}

// =========================
// 전체 삭제
// =========================
function deleteAllNames(){

  if(
    !confirm(
      "등록된 이름 전체 삭제할까요?"
    )
  ){
    return;
  }

  window.nameList = [];

  window.selectedNames = [];

  localStorage.setItem(
    "nameList",
    JSON.stringify([])
  );

  google.script.run

    .withSuccessHandler(()=>{

      renderNameButtons();

      highlightSelected();

      updateNameInput();

      checkForm();

      alert("전체 삭제 완료");
    })

    .saveNamesToServer([]);
}

// =========================
// 초기 실행
// =========================
document.addEventListener(
  "DOMContentLoaded",
  ()=>{

    renderNameButtons();

    highlightSelected();

    updateNameInput();
  }
);
</script>
