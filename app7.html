<script>
function uploadMenuImage(){

  document.getElementById(
    "uploadLoading"
  ).style.display = "flex";

  const files =
    document.getElementById("menuFile").files;

  if(!files.length){

    document.getElementById(
      "uploadLoading"
    ).style.display = "none";

    alert("사진을 선택하세요.");

    return;
  }

  let completed = 0;

  Array.from(files).forEach(file => {

    const reader =
      new FileReader();

    reader.onload = function(e){

      google.script.run

        .withSuccessHandler(()=>{

          completed++;

          if(completed === files.length){

            document.getElementById(
              "uploadLoading"
            ).style.display = "none";

            alert(
              files.length +
              "개 메뉴판 등록이 완료되었습니다."
            );

            document.getElementById(
              "menuFile"
            ).value = "";

            loadMenuThumbnail();

            previewMenuImage();
          }

        })

        .withFailureHandler(err=>{

          document.getElementById(
            "uploadLoading"
          ).style.display = "none";

          console.error(err);

          alert(err.message);

        })

        .saveMenuImage(
          DEFAULT_TEAM,
          e.target.result,
          file.name
        );
    };

    reader.readAsDataURL(file);

  });

}

function previewMenuImage(){

  google.script.run

    .withSuccessHandler(imgs=>{

      if(
        !imgs ||
        imgs.length === 0
      ){

        alert(
          "등록된 메뉴판이 없습니다."
        );

        return;
      }

      const box =
        document.getElementById(
          "menuPreviewContainer"
        );

      let current = 0;

      function renderImage(){

        const item = imgs[current];

        box.innerHTML = `
          <div
            style="
              text-align:center;
              height:100%;
            "
          >

            <img
              src="${item.url}"
              style="
                max-width:95%;
                max-height:75vh;
                object-fit:contain;
                border-radius:10px;
              "
            >

            <div
              style="
                margin-top:15px;
              "
            >

              <button
                onclick="
                  window.prevMenuImage()
                "
              >
                ◀ 이전
              </button>

              <span
                style="
                  margin:0 15px;
                  color:white;
                  font-size:18px;
                "
              >
                ${current + 1}
                /
                ${imgs.length}
              </span>

              <button
                onclick="
                  window.nextMenuImage()
                "
              >
                다음 ▶
              </button>

            </div>

            <div
              style="
                margin-top:15px;
              "
            >

              <button
                onclick="
                  deleteMenuImageClient(
                    '${item.id}'
                  )
                "
              >
                삭제
              </button>

            </div>

          </div>
        `;
      }

      window.prevMenuImage = function(){

        current--;

        if(current < 0){
          current = imgs.length - 1;
        }

        renderImage();
      };

      window.nextMenuImage = function(){

        current++;

        if(current >= imgs.length){
          current = 0;
        }

        renderImage();
      };

      renderImage();

      document.getElementById(
        "menuModal"
      ).style.display = "block";

    })

    .getMenuImages(
      DEFAULT_TEAM
    );
}

function deleteMenuImageClient(
  fileId
){

  if(
    !confirm(
      "이 메뉴판을 삭제할까요?"
    )
  ){
    return;
  }

  google.script.run

.withSuccessHandler(()=>{

  alert("메뉴판이 삭제되었습니다.");

  previewMenuImage();

  loadMenuThumbnail();

})

    .deleteMenuImage(
      DEFAULT_TEAM,
      fileId
    );
}

function closeMenuModal(){

  document.getElementById(
    "menuModal"
  ).style.display = "none";
}

function loadMenuThumbnail(){

  google.script.run

    .withSuccessHandler(imgs=>{
  console.log("썸네일 개수:", imgs.length);
  console.log(imgs);
      const box =
        document.getElementById(
          "menuThumbArea"
        );

      if(!box) return;

      if(
        !imgs ||
        imgs.length === 0
      ){

        box.innerHTML = "";

        return;
      }

   let html = `
  <div style="
    display:flex;
    justify-content:center;
    gap:8px;
    flex-wrap:wrap;
  ">
`;

imgs.slice(-3).forEach(item => {

  html += `
    <img
      src="${item.url}"
      onclick="previewMenuImage()"
      style="
        width:120px;
        height:120px;
        object-fit:cover;
        border-radius:10px;
        cursor:pointer;
        border:1px solid #ddd;
      "
    >
  `;

});

html += `
  </div>

  <div style="margin-top:5px;">
    메뉴판 미리보기 (${imgs.length}장)
  </div>
`;

box.innerHTML = html;
    })

    .getMenuImages(
      DEFAULT_TEAM
    );
}

document.addEventListener(
  "DOMContentLoaded",
  ()=>{

    loadMenuThumbnail();

  }
);

</script>
